name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Check public tree
        run: ./tools/check-public-tree.sh
      - name: Build Tap to Top
        run: ./apps/tap-to-top/build.sh
      - name: Build Holiday Sleep
        run: ./apps/holiday-sleep/build.sh
      - name: Test and build AirPods Glance
        run: |
          ./apps/airpods-glance/test-core.sh
          ./apps/airpods-glance/build.sh
          ./apps/airpods-glance/verify-apk.sh
