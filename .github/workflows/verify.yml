name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Check public tree
        run: ./tools/check-public-tree.sh
      - name: Test and build Tap to Top
        run: |
          sh ./apps/tap-to-top/test-core.sh
          ./apps/tap-to-top/build.sh
      - name: Test and build Holiday Sleep
        run: |
          sh ./apps/holiday-sleep/test-core.sh
          ./apps/holiday-sleep/build.sh
      - name: Test and build AirPods Glance
        run: |
          ./apps/airpods-glance/test-core.sh
          ./apps/airpods-glance/build.sh
          ./apps/airpods-glance/verify-apk.sh
